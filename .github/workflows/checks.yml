name: Checks da API
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sdd
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: emprestai_sdd
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sdd@127.0.0.1:5432/emprestai_sdd
      DIRECT_URL: postgresql://sdd@127.0.0.1:5432/emprestai_sdd
      PRACTICE_TEST_DATABASE_URL: postgresql://sdd@127.0.0.1:5432/emprestai_sdd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U sdd -d emprestai_sdd < tests/bootstrap.sql
      - run: npm run prisma:migrate
      - run: npm test
